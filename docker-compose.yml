version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:7.0
    container_name: fpms-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: fpms_admin
      MONGO_INITDB_ROOT_PASSWORD: fpms_secure_password_123
      MONGO_INITDB_DATABASE: fpms
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fpms-network

  # Main Application Service
  intellica-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production

    container_name: fpms-app

    # Port mapping - frontend and backend on same port
    ports:
      - "${PORT:-5000}:5000"

    # Environment variables
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
      - MONGO_URI=mongodb://fpms_admin:fpms_secure_password_123@mongodb:27017/fpms?authSource=admin
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production-min-32-chars}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-this-refresh-secret-in-production}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_APP_PASSWORD=${EMAIL_APP_PASSWORD}
      - ADMIN_REG_ID=${ADMIN_REG_ID:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_NAME=${ADMIN_NAME:-System Admin}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost:5000}

    # Restart policy
    restart: unless-stopped

    # Dependencies
    depends_on:
      mongodb:
        condition: service_healthy

    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Volume for uploads (persistent storage)
    volumes:
      - /documents:/documents

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - fpms-network

# Named volumes
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

# Network
networks:
  fpms-network:
    driver: bridge

